# Fly.io: `fly launch --copy-config` (pick a unique app name), then `fly volumes create data --size 1` and
# `fly deploy`. Steps in docs/deployment.md.
app = "opencaptions"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TRUST_PROXY = "1"
  GLOSSARY = "/app/data/glossary.json"
  SCHEDULE = "/app/data/schedule.json"

[[mounts]]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Never sleep: a stopped machine would cut the captions mid-talk.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  memory = "1gb"
  cpus = 1
