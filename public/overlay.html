<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="theme-color" content="#0b0b10" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Overlay · Subtítulos</title>
  <style>
    /*
      Broadcast overlay for vMix (Web Browser input) / OBS (Browser Source), 1920×1080.
      Layout:  ?stage=main&lang=es&lines=2&size=46&pos=bottom|top|middle&width=78&margin=64&hide=6&bg=transparent
      Bilingual: &also=en (or orig) adds a smaller second line in another language for mixed-language streams
      Style:   &font=inter|atkinson|lexend|roboto|opensans|montserrat|mono|system &weight=600 &color=ffffff
               &style=box|outline|shadow|none &box=000000 &alpha=78 &edge=000000 &upper=1 &align=center|left
      Design it visually at /style.html
    */
    html, body { margin: 0; height: 100%; background: var(--bg, transparent); overflow: hidden; }
    .wrap { position: fixed; left: 0; right: 0; display: flex; justify-content: center; padding: 0 4vw; }
    .wrap.bottom { bottom: var(--margin, 64px); }
    .wrap.top { top: var(--margin, 64px); }
    .wrap.middle { top: 50%; transform: translateY(-50%); }
    .box {
      max-width: var(--width, 78%); font-family: var(--cap-font); font-weight: var(--cap-weight);
      font-size: var(--size, 46px); line-height: 1.25; color: var(--cap-color); text-align: var(--cap-align);
      text-transform: var(--cap-transform); text-shadow: var(--cap-shadow); transition: opacity .6s;
      background: rgba(0, 0, 0, 0); padding: .22em .65em; border-radius: .22em;
    }
    .box.boxed { background: var(--cap-box); }
    .clip { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; max-height: calc(var(--size, 46px) * 1.25 * var(--lines, 2)); }
    .box.idle { opacity: 0; }
    .clip2 { display: none; flex-direction: column; justify-content: flex-end; overflow: hidden; font-size: .64em; opacity: .88; margin-top: .3em; max-height: calc(var(--size, 46px) * .64 * 1.25 * 2); }
    .box.bi .clip2 { display: flex; }
    .clip2 div:empty { display: none; }
  </style>
</head>
<body>
  <div class="wrap" id="wrap"><div class="box idle" id="box"><div class="clip"><div id="txt"></div></div><div class="clip2"><div id="txt2"></div></div></div></div>
  <script type="module">
    import { qs, wsUrl, Socket, CaptionState, applyCaptionStyle, previewStream, toColor } from '/common.js';
    const root = document.documentElement.style;
    const p = (k, d) => qs.get(k) ?? d;
    root.setProperty('--size', p('size', 46) + 'px');
    root.setProperty('--lines', p('lines', 2));
    root.setProperty('--width', p('width', 78) + '%');
    root.setProperty('--margin', p('margin', 64) + 'px');
    root.setProperty('--bg', toColor(p('bg', 'transparent')));
    const style = applyCaptionStyle(qs);
    const box = document.getElementById('box');
    box.classList.toggle('boxed', style === 'box');
    document.getElementById('wrap').className = 'wrap ' + p('pos', 'bottom');

    const lang = p('lang', 'es');
    const hideMs = Number(p('hide', 6)) * 1000;
    const chars = Number(p('chars', 150));
    const txt = document.getElementById('txt');
    const txt2 = document.getElementById('txt2');
    const also = p('also', '') !== lang ? p('also', '') : '';
    box.classList.toggle('bi', !!also);
    // Don't print the same words twice (e.g. the speaker is using the second line's language right now).
    const norm = (s) => s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().slice(-40);
    const second = (a, b) => (b && norm(a) !== norm(b) ? b : '');

    if (qs.get('preview') === '1') {
      // Style preview: fake streaming captions, no server connection.
      previewStream((t) => { txt.textContent = t.slice(-chars); box.classList.remove('idle'); }, lang === 'en' ? 'en' : 'es');
      if (also) previewStream((t) => { txt2.textContent = t.slice(-chars); }, lang === 'en' ? 'es' : 'en');
    } else {
      let ch = null, ch2 = null, talkId = null;
      const st = new CaptionState(), st2 = new CaptionState();
      new Socket(() => wsUrl('/ws/view', { stage: p('stage', 'main'), langs: [lang, also].filter(Boolean).join(',') }), {
        message(m) {
          if (m.type === 'hello') {
            ch = m.map[lang]; talkId = m.talk; st.load(m.history[ch] || [], m.partial[ch]); st.updatedAt = 0;
            if (also) { ch2 = m.map[also] ?? also; st2.load(m.history[ch2] || [], m.partial[ch2]); st2.updatedAt = 0; }
          }
          else if (m.type === 'caption' && m.channel === ch) { st.apply(m); draw(); }
          else if (m.type === 'caption' && ch2 && m.channel === ch2) { st2.apply(m); draw(); }
          else if (m.type === 'talk' && m.talk !== talkId) { talkId = m.talk; st.clear(); st2.clear(); draw(); }
        },
      });
      function draw() {
        const main = st.tail(chars);
        txt.textContent = main;
        if (also) txt2.textContent = second(main, st2.tail(chars));
        box.classList.remove('idle');
      }
      setInterval(() => box.classList.toggle('idle', Date.now() - Math.max(st.updatedAt, also ? st2.updatedAt : 0) > hideMs || !(st.tail(10) || (also && st2.tail(10)))), 500);
    }
  </script>
</body>
</html>
