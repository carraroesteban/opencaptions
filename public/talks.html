<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OpenCaptions" />
  <meta property="og:title" content="%EVENT% · Subtítulos en vivo / Live captions" />
  <meta property="og:description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:image" content="/brand/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Transcripciones</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    main { max-width: 860px; margin: 0 auto; padding: 22px 20px 64px; }
    .bar { display: flex; justify-content: space-between; align-items: center; }
    #back { text-decoration: none; font-size: 14px; }
    #back:hover { color: var(--fg); }
    h1 { font-size: clamp(32px, 6vw, 46px); margin: 44px 0 8px; }
    #hint { font-size: 17px; margin: 0; max-width: 560px; }
    .tools { display: flex; gap: 8px; margin: 28px 0 8px; flex-wrap: wrap; }
    .tools input { flex: 1; min-width: 200px; font-size: 16px; padding: 10px 14px 10px 42px; border-radius: 12px; }
    .tools select { border-radius: 12px; padding: 10px 36px 10px 12px; }
    .list { display: grid; gap: 10px; }
    .talk { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; text-decoration: none; padding: 16px 20px; }
    .talk h2 { font-size: 19px; margin: 0; line-height: 1.25; }
    .talk .m { grid-column: 1 / -1; color: var(--fg2); font-size: 14px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .day { margin: 26px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg2); }
    .none { padding: 48px 0; }
    .none .illo { width: 96px; color: var(--fg); }
    footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="bar"><a class="brand u-fs17" href="/">OpenCaptions</a><span class="row u-gap14"><a href="/" class="muted" id="back">‹</a><span id="prefs-slot"></span></span></div>
    <h1 id="h"></h1>
    <p class="muted" id="hint"></p>
    <div class="tools">
      <span class="has-icon u-grow"><input id="q" type="search" autocomplete="off" /></span>
      <select id="room" aria-label="Sala"></select>
    </div>
    <div class="list" id="list" data-no-i18n></div>
    <footer class="muted" id="foot"></footer>
  </main>
  <script type="module" src="/pages/talks.js"></script>
</body>
</html>
