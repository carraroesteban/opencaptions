<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Kit de QR</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .bar { max-width: 900px; margin: 0 auto; padding: 22px 20px; display: grid; gap: 12px; }
    .bar h1 { margin: 18px 0 0; font-size: 32px; }
    .warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); color: var(--warn); }
    .sheets { display: grid; gap: 28px; justify-content: center; padding: 8px 16px 48px; }
    /* A4 poster: printed on white paper, so it's always the light identity (all-ink logo, ink on lime). */
    .poster {
      --paper-w: #FFFFFF;
      width: 210mm; min-height: 297mm; background: var(--paper-w); color: var(--ink); border-radius: 8px; box-shadow: var(--shadow-lg);
      padding: 20mm 16mm 14mm; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 7mm; font-family: var(--font);
      print-color-adjust: exact; -webkit-print-color-adjust: exact;
    }
    .poster .ev { font-size: 15pt; font-weight: 700; color: var(--graphite); letter-spacing: .08em; text-transform: uppercase; }
    .poster h2 { font-family: var(--font-display); font-weight: 800; font-size: 50pt; margin: 0; line-height: 1; letter-spacing: -.03em; }
    .poster .lead { font-size: 24pt; font-weight: 700; margin: 0; }
    .poster .lead .hl { background: var(--lime); color: var(--ink); padding: .02em .22em; border-radius: .18em; }
    .poster .lead span.tr { display: block; font-size: 16pt; font-weight: 400; color: var(--graphite); margin-top: 3mm; }
    .poster img { width: 108mm; height: 108mm; image-rendering: pixelated; border: 1.5px solid var(--ink); border-radius: 6mm; padding: 4mm; }
    .poster .url { font-family: var(--mono); font-size: 14pt; color: var(--graphite); }
    .poster .langs { display: flex; gap: 3mm; flex-wrap: wrap; justify-content: center; }
    .poster .langs b { border: 1.5px solid var(--ink); border-radius: 99px; padding: 1.5mm 5mm; font-size: 13pt; }
    .poster .extra { font-size: 13pt; color: var(--ink); max-width: 150mm; line-height: 1.45; }
    .poster .extra .tr { color: var(--graphite); }
    .poster .how { display: flex; align-items: center; gap: 5mm; max-width: 172mm; text-align: left; }
    .poster .how .pict { flex: none; width: 36mm; height: auto; border: 0; padding: 0; border-radius: 0; image-rendering: auto; }
    .poster .how .extra { margin: 0; }
    .poster .foot { margin-top: auto; font-size: 10pt; color: #6A6870; display: flex; gap: 2mm; align-items: center; }
    .poster .foot img { width: 7mm; height: auto; border: 0; padding: 0; border-radius: 0; image-rendering: auto; }
    /* Small screens: show the A4 posters scaled down (printing still uses the real size). */
    @media screen and (max-width: 860px) { .poster { zoom: .5; } }
    @media screen and (max-width: 520px) { .poster { zoom: .42; } }
    @media print {
      @page { size: A4; margin: 0; }
      body { background: #fff; }
      .bar { display: none; }
      .sheets { padding: 0; gap: 0; display: block; }
      .poster { box-shadow: none; border-radius: 0; page-break-after: always; break-after: page; }
    }
  </style>
</head>
<body>
  <header class="bar" data-no-i18n>
    <a class="brand u-fs16" href="/admin.html" id="home">OpenCaptions</a>
    <h1 id="h"></h1>
    <p class="muted u-m0" id="intro"></p>
    <div class="card warn hidden" id="localwarn"></div>
    <div class="row">
      <label class="row"><span id="l-rooms"></span> <select id="which"><option value="" id="o-all"></option></select></label>
      <label class="row"><input type="checkbox" id="bilingual" checked /> <span id="l-bi"></span></label>
      <button class="primary" id="print"></button>
    </div>
  </header>
  <main class="sheets" id="sheets" data-no-i18n></main>
  <script type="module" src="/pages/kit.js"></script>
</body>
</html>
