<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OpenCaptions" />
  <meta property="og:title" content="%EVENT% · Subtítulos en vivo / Live captions" />
  <meta property="og:description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:image" content="/brand/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Subtítulos en vivo</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/audience.css" />
  <link rel="preload" href="/tokens.css" as="style" /><link rel="preload" href="/fonts/brand.css" as="style" /><!-- style.css @imports them: fetched together, not one after another -->
</head>
<body class="watch">
  <header class="w-head">
    <div class="w-bar">
      <a class="au-icon-btn" href="/" id="back-link" data-icon="back"></a>
      <img class="ev-logo w-logo hidden" id="ev-logo" alt="" />
      <div class="w-titles"><h1 id="stage">…</h1><p id="talk"></p></div>
      <span class="chip w-status" id="status" role="status"><span class="dot"></span><span></span></span>
    </div>
    <div class="w-langs" id="langs" role="group"></div>
  </header>
  <div id="pause" class="w-pause hidden" role="status"></div>
  <div id="listen-note" class="w-pause w-note hidden" role="status"><span></span><button id="listen-note-close" class="au-icon-btn" data-icon="x"></button></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>
  <div id="scroll" role="main"><div id="text"><div class="empty w-empty"><div class="w-skel" aria-hidden="true"><i class="skeleton"></i><i class="skeleton"></i><i class="skeleton"></i></div><span id="empty"></span></div></div></div>
  <div class="w-bottom" id="bottom">
    <button id="tolive" class="w-tolive hidden"></button>
    <div id="orig" class="w-orig hidden" role="complementary" aria-label="Original"><b></b><span></span></div>
    <footer class="w-dock">
      <button id="settings" class="au-btn au-aa" aria-haspopup="dialog">Aa</button>
      <span id="prefs-slot"></span>
      <button id="listen" class="au-btn hidden" aria-pressed="false"></button>
      <button id="dual" class="au-btn" aria-pressed="false"></button>
      <button id="pip" class="au-btn hidden" data-icon="pin"></button>
      <button id="slide" class="au-btn hidden" aria-haspopup="dialog" data-icon="monitor"></button>
      <button id="ai" class="w-ai hidden" aria-haspopup="dialog" data-icon="sparkle"><span class="lbl"></span></button>
      <a id="doc" class="au-btn" data-icon="doc"></a>
    </footer>
  </div>

  <dialog id="dlg-ai" class="sheet" aria-labelledby="ai-title">
    <div class="sheet-head"><h2 id="ai-title" class="as-title"></h2><button id="ai-close" data-icon="x"></button></div>
    <div id="assistant"></div>
    <button id="ai-term" class="as-more" type="button" data-icon="book"></button>
    <a id="ai-doc" class="as-more" href="#" data-icon="doc"></a>
  </dialog>

  <dialog id="dlg-term" class="sheet" aria-labelledby="term-title">
    <div class="sheet-head"><h2 id="term-title"></h2><button id="term-close" data-icon="x"></button></div>
    <p id="term-hint" class="muted"></p>
    <form id="term-form" class="as-form"><input id="term-q" maxlength="60" autocomplete="off" enterkeyhint="search" /><button id="term-go" class="as-send" type="submit" data-icon="search"></button></form>
    <div id="term-out" class="tm-out" aria-live="polite"></div>
  </dialog>

  <dialog id="dlg-slide" class="sheet w-slide" aria-labelledby="slide-title">
    <div class="sheet-head"><h2 id="slide-title"></h2><button id="slide-close" data-icon="x"></button></div>
    <figure class="sl-fig"><img id="slide-img" alt="" /><figcaption id="slide-text" aria-live="polite"></figcaption></figure>
    <div class="sl-nav" id="slide-nav"><button id="slide-prev" class="au-btn" data-icon="back"></button><span id="slide-pos"></span><button id="slide-next" class="au-btn sl-fwd" data-icon="back"></button></div>
  </dialog>

  <dialog id="dlg-set" class="sheet au-set" aria-labelledby="set-title">
    <div class="sheet-head"><h2 id="set-title"></h2><button id="set-close" data-icon="x"></button></div>
    <div class="au-row inline"><span class="au-lbl" id="l-size"></span><span class="au-stepper"><button id="smaller" class="a-sm">A</button><b id="size-val"></b><button id="bigger" class="a-lg">A</button></span></div>
    <div class="au-row"><span class="au-lbl" id="l-font"></span><div id="font-opts"></div></div>
    <div class="au-row"><span class="au-lbl" id="l-lh"></span><div id="lh-opts"></div></div>
    <div class="au-row"><span class="au-lbl" id="l-flow"></span><div id="flow-opts"></div></div>
    <label class="au-row inline"><span class="au-lbl" id="l-dual"></span><input type="checkbox" id="dual-sw" /></label>
  </dialog>
  <script type="module" src="/pages/watch.js"></script>
</body>
</html>
