<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OpenCaptions" />
  <meta property="og:title" content="%EVENT% · Subtítulos en vivo / Live captions" />
  <meta property="og:description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:image" content="/brand/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Subtítulos en vivo</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    header { padding: 12px 16px 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
    header .top { display: flex; align-items: center; gap: 10px; }
    header h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .talk { font-size: 14px; color: var(--fg2); margin: 2px 0 12px 38px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .talk:empty { margin-bottom: 8px; }
    .back { text-decoration: none; font-size: 22px; line-height: 1; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: var(--fg2); }
    .back:hover { background: var(--bg3); color: var(--fg); }
    .langs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 0 2px 38px; }
    #scroll { flex: 1; overflow-y: auto; padding: 24px 20px 48px; scroll-behavior: smooth; }
    #text { font-size: var(--size, 24px); line-height: var(--read-lh, 1.45); font-family: var(--read-font, var(--font)); max-width: 820px; margin: 0 auto; font-weight: 400; }
    #text p { margin: 0 0 .6em; transition: color .6s var(--ease); }
    #text p.old { color: var(--fg2); }
    #text p.partial { color: var(--fg); }
    #text .empty { color: var(--fg2); font-size: 18px; margin-top: 26vh; }
    #orig { border-top: 1px solid var(--line); padding: 12px 20px; font-size: 16px; color: var(--translation); background: var(--bg2); min-height: 3.2em; }
    #orig b { color: var(--fg2); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-right: 8px; }
    footer { display: flex; gap: 6px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); align-items: center; }
    footer .spacer { flex: 1; }
    footer button { padding: 8px 11px; font-size: 15px; }
    #settings { font-family: var(--font-display); font-weight: 800; }
    #ai { white-space: nowrap; }
    /* Phones: keep "What did I miss?" readable; "show original" moves into the Aa sheet. */
    @media (max-width: 440px) { #listen .lbl { display: none; } #dual { display: none; } #pip { display: none; } }
    @media (max-width: 330px) { #ai .lbl { display: none; } }
    footer a.btn { text-decoration: none; }
    #tolive { position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%); box-shadow: var(--shadow-lg); border-radius: var(--pill); }
    #listen[aria-pressed='true'], #pip[aria-pressed='true'] { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-fg); }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <a class="back" href="/" id="back-link">‹</a>
      <h1 id="stage">…</h1>
      <span class="chip" id="status"><span class="dot"></span> <span></span></span>
    </div>
    <div class="talk" id="talk"></div>
    <div class="langs" id="langs" role="group"></div>
  </header>
  <div id="scroll" aria-live="polite"><div id="text"><div class="empty empty-state"><svg class="oc-logo typing" viewBox="0 0 878 664" aria-hidden="true"><use class="o" href="/brand/sprite.svg#oc-o"/><use class="ln" href="/brand/sprite.svg#oc-line"/></svg><span id="empty"></span></div></div></div>
  <div id="orig" class="hidden"><b></b><span></span></div>
  <button id="tolive" class="primary hidden"></button>
  <footer>
    <button id="settings" aria-haspopup="dialog">Aa</button>
    <button id="dual" class="pill" aria-pressed="false"></button>
    <span class="spacer"></span>
    <button id="ai" class="primary" aria-haspopup="dialog" data-icon="sparkle"><span class="lbl"></span></button>
    <button id="listen" class="hidden" aria-pressed="false"></button>
    <button id="pip" class="hidden" data-icon="pin"></button>
    <a id="doc" class="btn"><button tabindex="-1" data-icon="doc"></button></a>
  </footer>

  <dialog id="dlg-ai" class="sheet" aria-labelledby="ai-title">
    <div class="sheet-head"><h2 id="ai-title"></h2><button id="ai-close" data-icon="x"></button></div>
    <div id="assistant"></div>
    <p style="margin:14px 0 0"><a id="ai-doc" href="#"></a></p>
  </dialog>

  <dialog id="dlg-set" class="sheet" aria-labelledby="set-title">
    <div class="sheet-head"><h2 id="set-title"></h2><button id="set-close" data-icon="x"></button></div>
    <div class="set-row"><span id="l-size"></span><span class="row"><button id="smaller" aria-label="A−">A−</button><b id="size-val" style="min-width:3ch;text-align:center"></b><button id="bigger" aria-label="A+">A+</button></span></div>
    <div class="set-row"><span id="l-font"></span><span class="row" id="font-opts"></span></div>
    <div class="set-row"><span id="l-lh"></span><span class="row" id="lh-opts"></span></div>
    <div class="set-row"><span id="l-theme"></span><span class="row" id="theme-opts"></span></div>
    <div class="set-row"><span id="l-dual"></span><span class="row" id="dual-opts"></span></div>
    <div class="set-row"><span id="l-ui"></span><span id="ui-slot"></span></div>
  </dialog>
  <script type="module" src="/pages/watch.js"></script>
</body>
</html>
