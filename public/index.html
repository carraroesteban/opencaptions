<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OpenCaptions" />
  <meta property="og:title" content="%EVENT% · Subtítulos en vivo / Live captions" />
  <meta property="og:description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:image" content="/brand/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Subtítulos en vivo</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    main { max-width: 780px; margin: 0 auto; padding: 22px 20px 64px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; margin: 52px 0 8px; }
    .hero .art { width: 300px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 20px; border: 1px solid var(--line); background: #FAF8F3; box-shadow: var(--shadow); }
    h1 { font-size: clamp(34px, 7vw, 52px); margin: 0 0 8px; }
    #subtitle { font-size: 18px; margin: 0; }
    .stages { display: grid; gap: 12px; margin-top: 32px; }
    .stage { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; text-decoration: none; padding: 20px 22px; }
    .stage h2 { margin: 0; font-size: 22px; }
    .stage .title { grid-column: 1 / -1; color: var(--fg2); font-size: 15px; }
    .stage .langs { grid-column: 1 / -1; margin-top: 4px; }
    .stage .next { font-size: 13px; }
    .lib { margin-top: 12px; background: transparent; border-style: dashed; border-color: var(--line-strong); box-shadow: none; }
    .lib .illo { width: 52px; color: var(--fg); }
    footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; gap: 12px; }
    @media (max-width: 560px) { .hero { grid-template-columns: 1fr; margin-top: 28px; } .hero .art { width: 100%; order: -1; } }
  </style>
</head>
<body>
  <main>
    <div class="bar"><a class="brand" href="/" title="Salas" style="font-size:17px">OpenCaptions</a></div>
    <section class="hero">
      <div><h1 id="event">…</h1><p class="muted" id="subtitle"></p></div>
      <img class="art" src="/art/audience.webp" alt="" />
    </section>
    <div class="stages" id="stages" data-no-i18n></div>
    <a class="card stage lib" href="/talks.html" id="lib"><h2 id="lib-h"></h2><span id="lib-illo"></span><div class="title" id="lib-p"></div></a>
    <footer class="muted row" style="justify-content:space-between">
      <span id="powered"></span>
      <a href="/admin.html" id="prod"></a>
    </footer>
  </main>
  <script type="module">
    import { getEvent, t, esc, langLabel } from '/common.js';
    import { prefsControls } from '/i18n.js';
    import { library } from '/illustrations.js';
    document.querySelector('footer').append(prefsControls());
    document.getElementById('lib-illo').innerHTML = library;
    document.getElementById('subtitle').textContent = t('chooseStage');
    document.getElementById('powered').textContent = t('poweredBy');
    document.getElementById('prod').textContent = t('production');
    document.getElementById('lib-h').textContent = t('library');
    document.getElementById('lib-p').textContent = t('libraryHint');
    async function render() {
      const ev = await getEvent();
      document.getElementById('event').textContent = ev.name;
      document.title = `${ev.name} · Subtítulos`;
      document.getElementById('stages').innerHTML = ev.stages.map((s) => `
        <a class="card stage" href="/watch.html?stage=${encodeURIComponent(s.id)}">
          <h2>${esc(s.name)}</h2>
          <span class="chip ${s.live ? 'bad' : ''}">${s.live ? `<span class="dot live"></span> ${t('live')}` : t('offline')}</span>
          ${s.title ? `<div class="title">${esc(s.title)}${s.speaker ? ` · <span class="muted">${esc(s.speaker)}</span>` : ''}</div>` : ''}
          ${s.next ? `<div class="title next">${esc(t('next'))}: ${esc(s.next.title)} · ${new Date(s.next.start).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</div>` : ''}
          <div class="langs row">${s.languages.map((l) => `<span class="chip">${esc(langLabel(l, ev.languages))}</span>`).join('')}</div>
        </a>`).join('');
    }
    render();
    setInterval(render, 10000);
  </script>
</body>
</html>
