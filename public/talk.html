<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OpenCaptions" />
  <meta property="og:title" content="%EVENT% · Subtítulos en vivo / Live captions" />
  <meta property="og:description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:image" content="/brand/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Transcripción</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { min-height: 100dvh; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 64px; }
    .top { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
    .top a { text-decoration: none; }
    #back { font-size: 14px; } #back:hover { color: var(--fg); }
    h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.08; margin: 36px 0 10px; max-width: 900px; }
    .meta { color: var(--fg2); font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 12px 0; margin-top: 18px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
    .toolbar .langs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .toolbar .search { display: flex; gap: 8px; align-items: center; }
    .toolbar .search input { flex: 1; font-size: 16px; padding: 10px 14px; border-radius: 12px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; margin-top: 28px; align-items: start; }
    aside { position: sticky; top: 118px; }
    aside .card h2 { font-size: 19px; margin: 0 0 10px; }
    #doc { font-family: var(--read-font, var(--font)); font-size: var(--size, 19px); line-height: var(--read-lh, 1.6); max-width: 760px; }
    #doc .para { display: grid; grid-template-columns: 58px 1fr; gap: 10px; margin: 0 0 18px; }
    #doc .ts { font-family: var(--mono); font-size: 12px; color: var(--fg2); padding-top: .45em; text-decoration: none; }
    #doc .ts:hover { color: var(--fg); }
    #doc p { margin: 0; }
    #doc .para.flash { animation: flash 1.6s; border-radius: 8px; }
    @keyframes flash { 0% { background: color-mix(in srgb, var(--hl) 45%, transparent); } 100% { background: transparent; } }
    .empty { color: var(--fg2); padding: 40px 0; text-align: center; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions a { text-decoration: none; }
    details.dl { position: relative; }
    details.dl summary { list-style: none; cursor: pointer; background: var(--bg2); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow-sm); }
    details.dl summary::-webkit-details-marker { display: none; }
    details.dl .menu { position: absolute; z-index: 10; top: calc(100% + 6px); left: 0; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: grid; min-width: 180px; box-shadow: var(--shadow-lg); }
    details.dl .menu a { padding: 8px 10px; border-radius: 8px; text-decoration: none; }
    details.dl .menu a:hover { background: var(--bg3); }
    #count { font-size: 13px; color: var(--fg2); white-space: nowrap; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: minmax(0, 1fr); } aside { position: static; order: -1; min-width: 0; } #doc .para { grid-template-columns: 1fr; gap: 2px; }
      .toolbar { position: static; } .actions .lbl { display: none; } #live span { display: none; }
    }
    @media print {
      .toolbar, aside, .top .prefs, .actions, #follow { display: none !important; }
      .grid { display: block; } body { background: #fff; color: #000; } #doc { font-size: 12pt; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="/" title="Salas" style="font-size:17px">OpenCaptions</a>
      <a href="/talks.html" id="back" class="muted">‹ …</a>
    </div>
    <h1 id="title">…</h1>
    <div class="meta" id="meta"></div>

    <div class="toolbar">
      <div class="langs" id="langs" role="group"></div>
      <div class="search">
        <input id="q" type="search" autocomplete="off" />
        <span id="count"></span>
      </div>
      <div class="actions">
        <a id="live" class="hidden"><button>🔴 <span></span></button></a>
        <details class="dl"><summary>⬇ <span class="lbl" id="dl-lbl"></span></summary>
          <div class="menu"><a id="dl-txt">TXT · texto</a><a id="dl-srt">SRT · subtítulos</a><a id="dl-vtt">VTT · web</a></div>
        </details>
        <button id="copy">🔗 <span class="lbl"></span></button>
        <button id="print">🖨 <span class="lbl"></span></button>
        <button id="settings">Aa</button>
      </div>
    </div>

    <div class="grid">
      <main id="doc" aria-live="polite"><div class="empty">…</div></main>
      <aside>
        <div class="card"><h2 id="sum-title"></h2><div id="assistant"></div></div>
      </aside>
    </div>
    <button id="follow" class="primary hidden" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%)"></button>
  </div>

  <dialog id="dlg-set" class="sheet" aria-labelledby="set-title">
    <div class="sheet-head"><h2 id="set-title"></h2><button id="set-close" aria-label="close">✕</button></div>
    <div class="set-row"><span id="l-size"></span><span class="row"><button id="smaller">A−</button><b id="size-val" style="min-width:3ch;text-align:center"></b><button id="bigger">A+</button></span></div>
    <div class="set-row"><span id="l-font"></span><span class="row" id="font-opts"></span></div>
    <div class="set-row"><span id="l-lh"></span><span class="row" id="lh-opts"></span></div>
    <div class="set-row"><span id="l-theme"></span><span class="row" id="theme-opts"></span></div>
  </dialog>

  <script type="module" src="/pages/talk.js"></script>
</body>
</html>
