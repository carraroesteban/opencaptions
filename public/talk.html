<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OpenCaptions" />
  <meta property="og:title" content="%EVENT% · Subtítulos en vivo / Live captions" />
  <meta property="og:description" content="Subtítulos y traducción en vivo de cada sala, en tu idioma. Live captions and translation for every room." />
  <meta property="og:image" content="/brand/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Transcripción</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preload" href="/tokens.css" as="style" /><link rel="preload" href="/fonts/brand.css" as="style" /><!-- style.css @imports them: fetched together, not one after another -->
  <link rel="stylesheet" href="/audience.css" />
</head>
<body>
  <main class="tk">
    <div class="au-bar">
      <a class="brand u-fs17" href="/">OpenCaptions</a>
      <span class="row u-gap14"><a href="/talks.html" id="back" class="au-back" data-icon="back"></a><span id="prefs-slot"></span></span>
    </div>
    <header class="tk-head">
      <p class="au-eyebrow" id="eyebrow"></p>
      <h1 id="title">…</h1>
      <div class="tk-meta" id="meta"></div>
      <div class="tk-actions">
        <a id="live" class="au-btn hidden"><span class="dot live"></span><span class="live-lbl"></span></a>
        <details class="dl"><summary class="au-btn" data-icon="download"><span class="lbl" id="dl-lbl"></span></summary>
          <div class="menu"><a id="dl-txt">TXT</a><a id="dl-srt">SRT</a><a id="dl-vtt">VTT</a></div>
        </details>
        <button id="copy" class="au-btn" data-icon="link"><span class="lbl"></span></button>
        <button id="print" class="au-btn" data-icon="print"><span class="lbl"></span></button>
        <button id="fix" class="au-btn hidden" data-icon="wand" aria-pressed="false"><span class="lbl"></span></button>
        <button id="del" class="au-btn danger hidden" data-icon="x"><span class="lbl"></span></button>
      </div>
    </header>

    <div class="tk-bar" id="toolbar">
      <div class="tk-bar-in">
        <div class="tk-langs" id="langs" role="group"></div>
        <div class="tk-search has-icon au-search"><input id="q" type="search" autocomplete="off" /><span id="count" aria-live="polite"></span></div>
        <button id="settings" class="au-btn au-aa" aria-haspopup="dialog">Aa</button>
      </div>
      <span id="fix-hint" class="hidden" role="status"></span>
    </div>

    <div class="tk-grid">
      <article id="doc" aria-live="polite"><div class="empty">…</div></article>
      <aside><div class="tk-ai"><h2 id="sum-title" class="as-title"></h2><div id="assistant"></div></div></aside>
    </div>
    <footer class="tl-foot hidden" id="credit"></footer>
    <button id="follow" class="primary tk-follow hidden"></button>
  </main>

  <dialog id="dlg-del" class="tk-del" aria-labelledby="del-title"><form method="dialog">
    <h2 id="del-title"></h2>
    <div class="tk-del-acts"><button value="cancel" id="del-no"></button><button value="ok" class="danger" id="del-ok"></button></div>
  </form></dialog>

  <dialog id="dlg-set" class="sheet au-set" aria-labelledby="set-title">
    <div class="sheet-head"><h2 id="set-title"></h2><button id="set-close" data-icon="x"></button></div>
    <div class="au-row inline"><span class="au-lbl" id="l-size"></span><span class="au-stepper"><button id="smaller" class="a-sm">A</button><b id="size-val"></b><button id="bigger" class="a-lg">A</button></span></div>
    <div class="au-row"><span class="au-lbl" id="l-font"></span><div id="font-opts"></div></div>
    <div class="au-row"><span class="au-lbl" id="l-lh"></span><div id="lh-opts"></div></div>
  </dialog>

  <script type="module" src="/pages/talk.js"></script>
</body>
</html>
