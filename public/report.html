<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Informe del evento · OpenCaptions</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preload" href="/tokens.css" as="style" /><link rel="preload" href="/fonts/brand.css" as="style" /><!-- style.css @imports them: fetched together, not one after another -->
  <style>
    /* A report to hand to a client: the headline numbers, then every talk per room. Prints as a clean document. */
    main { width: 100%; max-width: 1100px; margin: 0 auto; padding: 18px 28px 64px; }
    .rp-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin: 34px 0 26px; }
    .kicker { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg2); }
    h1 { font-size: clamp(32px, 4.6vw, 52px); line-height: 1.02; letter-spacing: -.035em; margin: 0 0 8px; }
    .sub { color: var(--fg2); margin: 0; font-size: 16px; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tools select, .tools button { min-height: 42px; border-radius: var(--pill); }
    .tools a.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 16px; border-radius: var(--pill); background: var(--fill); color: var(--fg); font-weight: 600; text-decoration: none; transition: background-color var(--dur-fast) var(--ease-out); }
    .tools a.btn:hover { background: var(--fill-hover); }
    .totals { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin: 0 0 40px; }
    @media (max-width: 1320px) { .totals { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .totals { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .total { display: grid; gap: 10px; padding: 16px 18px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--bg2); box-shadow: var(--shadow-sm); }
    .total small { display: flex; align-items: center; gap: 8px; color: var(--fg2); font-size: 13px; font-weight: 600; }
    .total small svg.i { width: 16px; height: 16px; color: var(--hue); }
    /* a hue per number, in turn: its icon and a soft wash from the corner (the label says what it is) */
    .total:not(.skeleton) { background: var(--bg2) radial-gradient(120% 100% at 0 0, color-mix(in srgb, var(--hue) 10%, transparent), transparent 70%); }
    .total:nth-child(6n + 1) { --hue: var(--c-blue); } .total:nth-child(6n + 2) { --hue: var(--c-violet); } .total:nth-child(6n + 3) { --hue: var(--c-teal); }
    .total:nth-child(6n + 4) { --hue: var(--c-rose); } .total:nth-child(6n + 5) { --hue: var(--c-orange); } .total:nth-child(6n) { --hue: var(--c-green); }
    :root[data-theme='contrast'] .total { background: var(--bg2); }
    .total b { display: block; font-family: var(--font-display); font-size: clamp(24px, 2.1vw, 30px); font-weight: 800; letter-spacing: -.02em; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .total.skeleton { min-height: 92px; border: 0; }
    .room { margin: 0 0 30px; }
    .room h2 { font-size: 22px; margin: 0 0 12px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .room h2 small { font-family: var(--font); font-weight: 400; font-size: 14px; color: var(--fg2); }
    .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--bg2); box-shadow: var(--shadow-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg2); font-weight: 700; white-space: nowrap; background: color-mix(in srgb, var(--fill) 50%, transparent); }
    tbody tr { transition: background-color var(--dur-fast) var(--ease-out); }
    tbody tr:hover { background: var(--fill); }
    tr:last-child td { border-bottom: 0; }
    td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    td .who { color: var(--fg2); font-size: 13px; margin-top: 2px; }
    /* How long each talk ran, next to the others in its room */
    .len { display: grid; justify-items: end; gap: 6px; }
    .len i { display: block; height: 4px; width: 72px; border-radius: 4px; background: var(--fill); overflow: hidden; }
    .len i b { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--fg); transition: width .8s var(--ease-out); }
    .empty { display: grid; justify-items: center; gap: 14px; padding: 36px 0 20px; text-align: center; color: var(--fg2); }
    .empty img { width: min(360px, 80%); height: auto; border-radius: 22px; border: 1px solid var(--line); background: #FAF8F3; }
    .foot { margin-top: 40px; color: var(--fg2); font-size: 13px; max-width: 80ch; }
    @media (max-width: 600px) { main { padding: 12px 16px 48px; } .rp-head { margin-top: 18px; } .tools { width: 100%; display: grid; } .tools #print { order: -1; justify-content: center; } }
    @media print {
      * { animation: none !important; transition: none !important; }
      .crumbbar, .tools { display: none !important; }
      main { padding: 0; max-width: none; }
      .rp-head { margin-top: 0; }
      .totals { grid-template-columns: repeat(3, 1fr); }
      .wrap, .total { border-color: #ccc; background: none !important; box-shadow: none; }
      .room h2 { break-after: avoid; }
      tr { break-inside: avoid; }
      tbody tr:hover { background: none; }
    }
  </style>
</head>
<body data-gate>
  <main data-no-i18n>
    <header class="crumbbar" id="crumbbar"><span id="prefs-slot"></span></header>
    <div class="rp-head rise">
      <div><p class="kicker" id="kicker"></p><h1 id="title"></h1><p class="sub" id="sub"></p></div>
      <div class="tools">
        <select id="day" class="hidden"></select>
        <a id="csv" class="btn" href="/api/report.csv"></a>
        <button type="button" class="primary" id="print"></button>
      </div>
    </div>
    <section class="totals stagger" id="totals"><div class="total skeleton"></div><div class="total skeleton"></div><div class="total skeleton"></div><div class="total skeleton"></div><div class="total skeleton"></div><div class="total skeleton"></div></section>
    <div id="rooms"></div>
    <p class="foot" id="foot"></p>
  </main>
  <script type="module" src="/pages/report.js"></script>
</body>
</html>
