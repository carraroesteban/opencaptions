<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Pantalla · Subtítulos</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Projector / stage screen. Params: ?stage=main&langs=es,orig&qr=1&ui=es&size=6.4&lines=3 (default: fill the screen)
       Style: &font=… &weight=… &color=ffffff &bg=111014 &accent=d4ff3a &upper=1 &align=left|center &style=none|shadow|outline
       Design it visually at /style.html */
    html, body { background: var(--screen-bg, var(--ink)); color: var(--paper); height: 100%; overflow: hidden; cursor: none; }
    .band { font-family: var(--cap-font); text-transform: var(--cap-transform); text-align: var(--cap-align); text-shadow: var(--cap-shadow); }
    .band.main .clip { color: var(--cap-color); font-weight: var(--cap-weight); }
    .wrap { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: 3vh 4vw; gap: 2vh; }
    .head { display: flex; justify-content: space-between; align-items: baseline; color: #A8A5AE; font-size: 2.2vh; }
    .head b { color: var(--paper); font-family: var(--font-display); font-weight: 800; letter-spacing: -.01em; }
    #clock { font-variant-numeric: tabular-nums; }
    .bands { display: flex; flex-direction: column; justify-content: flex-end; gap: 3vh; min-height: 0; }
    .band { line-height: 1.22; transition: opacity 1s; min-height: 0; }
    /* The main language fills the screen from the bottom up; older lines fade out at the top. */
    .band.main { flex: 1 1 auto; display: flex; flex-direction: column; }
    .band.main .clip { flex: 1 1 auto; min-height: 0; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%); mask-image: linear-gradient(to bottom, transparent, #000 14%); }
    .fixed-lines .band.main { flex: 0 0 auto; }
    .fixed-lines .band.main .clip { flex: none; -webkit-mask-image: none; mask-image: none; }
    .band .clip { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
    .band.main .clip { font-size: var(--main, 6.4vh); }
    .fixed-lines .band.main .clip { height: calc(var(--main, 6.4vh) * 1.22 * var(--lines, 3)); }
    .band.sub .clip { font-size: 3.6vh; height: calc(3.6vh * 1.22 * 2); color: var(--fog); font-weight: 400; } /* translation tone */
    .band .lbl { font-family: var(--font); font-size: 1.6vh; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: .8vh; font-weight: 700; }
    .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 2vw; }
    .qr { display: flex; align-items: center; gap: 1.4vw; background: #1B1A20; border: 1px solid #2A2930; padding: 1.4vh 1.4vw; border-radius: 1.8vh; }
    .qr img { width: 14vh; height: 14vh; background: #fff; border-radius: 1vh; padding: .6vh; }
    .qr div { font-size: 2.1vh; color: var(--fog); max-width: 26vw; }
    .qr b { display: block; color: var(--paper); font-family: var(--font-display); font-weight: 800; font-size: 2.7vh; letter-spacing: -.01em; margin-bottom: .5vh; }
    .foot-l { font-size: 1.8vh; color: #77757E; display: flex; align-items: center; gap: .5em; } .foot-l i { font-style: normal; }
    .foot-l .brand { color: #A8A5AE; } .foot-l .brand::before { background-image: url(/brand/mark-dark.svg); } /* always dark: paper O + lime line */
    .fade { opacity: .25; transition: opacity 1s; }
    .fs-hint { position: fixed; top: 3vh; left: 50%; transform: translateX(-50%); background: #1B1A20; border: 1px solid #2A2930; color: var(--fog); font-size: 1.8vh; padding: .8vh 1.6vh; border-radius: 99px; transition: opacity .6s; }
    .fs-hint kbd { font: inherit; font-weight: 700; color: var(--ink); background: var(--lime); border-radius: .5vh; padding: 0 .6vh; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><span><b id="stage"></b> <span id="talk"></span></span><span id="clock"></span></div>
    <div class="bands" id="bands"></div>
    <div class="foot">
      <div class="foot-l"><span class="brand">OpenCaptions</span> · <i id="powered"></i></div>
      <div class="qr" id="qrbox"><img id="qr" alt="QR" /><div><b id="follow"></b><span id="url"></span></div></div>
    </div>
  </div>
  <script type="module">
    import { qs, t, esc, wsUrl, Socket, CaptionState, getEvent, langLabel, applyCaptionStyle, previewStream, toColor, wakeLock, liveText } from '/common.js';
    wakeLock(); // projector PCs must not blank mid-talk
    const $ = (id) => document.getElementById(id);
    const stageId = qs.get('stage') || 'main';
    const ev = await getEvent();
    const want = (qs.get('langs') || 'es,orig').split(',');
    if (Number(qs.get('lines')) > 0) { document.documentElement.style.setProperty('--lines', qs.get('lines')); document.body.classList.add('fixed-lines'); }
    // Full screen: double-click or F (projector PCs often open the page in a normal window).
    const toggleFs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.())?.catch?.(() => {});
    document.addEventListener('dblclick', toggleFs);
    document.addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') toggleFs(); });
    if (qs.get('preview') !== '1' && !document.fullscreenElement) {
      const hint = Object.assign(document.createElement('div'), { className: 'fs-hint' });
      hint.innerHTML = `<kbd>F</kbd> ${t('fullscreen')}`;
      document.body.append(hint);
      setTimeout(() => { hint.style.opacity = 0; setTimeout(() => hint.remove(), 700); }, 5000);
    }
    if (qs.get('size')) document.documentElement.style.setProperty('--main', qs.get('size') + 'vh');
    applyCaptionStyle(qs, { style: 'none', align: 'left' });
    if (qs.get('bg')) document.documentElement.style.setProperty('--screen-bg', toColor(qs.get('bg')));
    if (qs.get('clock') === '0') $('clock').classList.add('hidden');
    $('powered').textContent = t('poweredBy');
    $('follow').textContent = t('followOnPhone');
    const viewUrl = `${ev.publicUrl}/s/${stageId}`;
    $('url').textContent = viewUrl.replace(/^https?:\/\//, '');
    $('qr').src = `/api/qr.svg?text=${encodeURIComponent(viewUrl)}`;
    if (qs.get('qr') === '0') $('qrbox').classList.add('hidden');

    let hello, talkId = null, bands = [];
    const fixed = document.body.classList.contains('fixed-lines');
    const states = {};
    if (qs.get('preview') === '1') {
      // Style preview: fake captions, no server needed. Shows exactly the bands the URL asks for (langs=es or es,orig).
      bands = [...new Set(want)].slice(0, 2);
      $('stage').textContent = ev.stages.find((s) => s.id === stageId)?.name || ev.stages[0]?.name || '';
      $('bands').innerHTML = bands.map((l, i) => `<div class="band ${i ? 'sub' : 'main'}" id="b-${esc(l)}"><div class="lbl">${esc(langLabel(l, ev.languages))}</div><div class="clip"><div class="txt"></div></div></div>`).join('');
      const fake = (l) => (l === 'en' ? 'en' : l === 'orig' && bands[0] !== 'en' ? 'en' : 'es');
      bands.forEach((l, i) => {
        states[l] = { updatedAt: Date.now(), tail: () => '' };
        previewStream((x) => { states[l].updatedAt = Date.now(); document.querySelector(`#b-${CSS.escape(l)} .txt`).textContent = x.slice(i ? -200 : -600); }, fake(l));
      });
    } else new Socket(() => wsUrl('/ws/view', { stage: stageId, langs: want.join(',') }), {
      message(m) {
        if (m.type === 'hello') {
          hello = m;
          talkId = m.talk;
          $('stage').textContent = m.stage.name;
          $('talk').textContent = m.stage.title ? `· ${m.stage.title}` : '';
          // Distinct channels in the requested order (e.g. es→orig when the talk is already in Spanish).
          bands = [...new Set(want.map((l) => m.map[l]))];
          for (const ch of bands) (states[ch] ??= new CaptionState()).load(m.history[ch], m.partial[ch]);
          $('bands').innerHTML = bands.map((ch, i) => {
            const label = want.find((l) => m.map[l] === ch);
            return `<div class="band ${i ? 'sub' : 'main'}" id="b-${ch}"><div class="lbl">${esc(langLabel(label === 'orig' ? 'orig' : label, ev.languages))}</div><div class="clip"><div class="txt"></div></div></div>`;
          }).join('');
          render();
        } else if (m.type === 'caption') { (states[m.channel] ??= new CaptionState()).apply(m); render(m.channel); }
        else if (m.type === 'talk' || m.type === 'title') {
          $('talk').textContent = m.title ? `· ${m.title}` : '';
          if (m.type === 'talk' && m.talk !== talkId) { talkId = m.talk; for (const s of Object.values(states)) s.clear(); render(); }
        }
      },
    });

    function render(only) {
      bands.forEach((ch, i) => {
        if (only && only !== ch) return;
        const el = document.querySelector(`#b-${CSS.escape(ch)} .txt`);
        if (el) liveText(el, states[ch]?.tail(i ? 200 : fixed ? 260 : 900) || '', i > 0 || !states[ch]?.partial?.text); // highlighter on the live word of the main band
        document.getElementById(`b-${ch}`)?.classList.remove('fade');
      });
    }
    setInterval(() => {
      for (const ch of bands) {
        const idle = Date.now() - (states[ch]?.updatedAt || 0) > 12000;
        document.getElementById(`b-${ch}`)?.classList.toggle('fade', idle);
      }
      $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);
  </script>
</body>
</html>
