<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Pantalla · Subtítulos</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preload" href="/tokens.css" as="style" /><link rel="preload" href="/fonts/brand.css" as="style" /><!-- style.css @imports them: fetched together, not one after another -->
  <style>
    /* Projector / stage screen. Params: ?stage=main&langs=es,orig&qr=1&ui=es&size=6.4&lines=3 (default: fill the screen)
       Style: &font=… &weight=… &color=ffffff &bg=111014 &accent=d4ff3a &upper=1 &align=left|center &style=none|shadow|outline
       Design it visually at /style.html */
    html, body { background: var(--screen-bg, var(--ink)); color: var(--paper); height: 100%; overflow: hidden; cursor: none; }
    .band { font-family: var(--cap-font); text-transform: var(--cap-transform); text-align: var(--cap-align); text-shadow: var(--cap-shadow); }
    .band.main .clip { color: var(--cap-color); font-weight: var(--cap-weight); }
    .wrap { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: 3vh 4vw; gap: 2vh; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 2vw; color: #A8A5AE; font-size: 2.3vh; }
    .head > span:first-child { display: flex; align-items: center; gap: .7em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head .ev-logo { flex: none; height: 5.6vh; max-width: 24vw; object-fit: contain; object-position: left center; margin-right: .5em; } /* the event's own (Settings › General) */
    .head b { color: var(--paper); font-family: var(--font-display); font-weight: 800; letter-spacing: -.015em; }
    #talk:not(:empty)::before { content: '·'; margin-right: .7em; color: #5C5A63; }
    /* On air: a red dot that breathes while words are coming, grey when the room is quiet */
    .onair { flex: none; width: 1.1vh; height: 1.1vh; border-radius: 50%; background: #5C5A63; transition: background-color .6s; }
    .onair.on { background: #FF5A47; animation: onair 2s ease-in-out infinite; }
    @keyframes onair { 50% { box-shadow: 0 0 0 .7vh rgb(255 90 71 / 0); } 0%, 100% { box-shadow: 0 0 0 0 rgb(255 90 71 / .45); } }
    #clock { font-variant-numeric: tabular-nums; }
    .bands { position: relative; min-height: 0; }
    #bands { display: flex; flex-direction: column; justify-content: flex-end; gap: 3vh; height: 100%; min-height: 0; }
    .band { line-height: 1.22; transition: opacity 1s; min-height: 0; }
    /* The main language fills the screen from the bottom up; older lines fade out at the top. */
    .band.main { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end; }
    .band.main .clip { flex: 1 1 auto; min-height: 0; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%); mask-image: linear-gradient(to bottom, transparent, #000 14%); }
    .fixed-lines .band.main { flex: 0 0 auto; }
    .fixed-lines .band.main .clip { flex: none; -webkit-mask-image: none; mask-image: none; }
    .band .clip { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
    .band.main .clip { font-size: var(--main, 6.4vh); }
    .fixed-lines .band.main .clip { height: calc(var(--main, 6.4vh) * 1.22 * var(--lines, 3)); }
    .band.sub { flex: none; } /* its two lines keep their room: the main band gives way, or they'd run into the QR card */
    .band.sub .clip { font-size: 3.6vh; height: calc(3.6vh * 1.22 * 2); color: var(--fog); font-weight: 400; } /* translation tone */
    .band .lbl { font-family: var(--font); font-size: 1.6vh; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: .8vh; font-weight: 700; }
    .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 2vw; }
    .qr { display: flex; align-items: center; gap: 1.6vw; background: linear-gradient(180deg, #1D1C22, #17161B); border: 1px solid #2A2930; padding: 1.4vh 2vw 1.4vh 1.4vh; border-radius: 2.6vh; box-shadow: 0 2vh 5vh -2vh rgb(0 0 0 / .6); }
    .qr img { width: 15vh; height: 15vh; background: #fff; border-radius: 1.6vh; padding: .9vh; }
    .qr div { display: grid; gap: .6vh; font-size: 2vh; color: #A8A5AE; max-width: 28vw; }
    .qr b { color: var(--paper); font-family: var(--font-display); font-weight: 800; font-size: 2.8vh; line-height: 1.1; letter-spacing: -.015em; }
    #url { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    .qr-langs { display: flex; flex-wrap: wrap; gap: .6vh; margin-top: .4vh; }
    .qr-langs:empty { display: none; }
    .qr-langs i { font-style: normal; font-size: 1.6vh; font-weight: 700; padding: .35vh 1vh; border-radius: 99px; background: var(--lime); color: var(--ink); } /* lime only as a fill, ink on it */
    .foot-l { font-size: 1.8vh; color: #8D8A94; display: flex; align-items: center; gap: .5em; } .foot-l i { font-style: normal; }
    .foot-l .brand { color: #A8A5AE; } .foot-l .brand::before { background-image: url(/brand/mark-dark.svg); } /* always dark: paper O + lime line */
    .fade { opacity: .25; transition: opacity 1s; }
    /* A break (big card: when we're back, what's next) or music (a quiet note): captions are paused on purpose. */
    .pause { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 2.4vh; background: var(--screen-bg, var(--ink)); z-index: 2; text-align: var(--cap-align, left); }
    #bands.paused { visibility: hidden; }
    .pause b { font-family: var(--font-display); font-weight: 800; font-size: 11vh; line-height: 1; letter-spacing: -.02em; color: var(--paper); }
    .pause span { font-size: 4.2vh; color: var(--fog); }
    .pause span.next { color: var(--paper); }
    .pause.music b { font-size: 9vh; color: var(--accent); }
    .pause.music span { font-size: 3.2vh; }
    .fs-hint { position: fixed; top: 3vh; left: 50%; transform: translateX(-50%); background: #1B1A20; border: 1px solid #2A2930; color: var(--fog); font-size: 1.8vh; padding: .8vh 1.6vh; border-radius: 99px; transition: opacity .6s; }
    .fs-hint kbd { font: inherit; font-weight: 700; color: var(--ink); background: var(--lime); border-radius: .5vh; padding: 0 .6vh; }
    @media (pointer: coarse) { .fs-hint { display: none; } } /* no F key on a touch screen; a double tap still works */
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head"><span><img class="ev-logo hidden" id="ev-logo" alt="" /><i class="onair" id="onair"></i><b id="stage"></b><span id="talk"></span></span><span id="clock"></span></div>
    <div class="bands"><div id="bands"></div><div id="pause" class="pause hidden" role="status"></div></div>
    <div class="foot">
      <div class="foot-l"><span class="brand">OpenCaptions</span> · <i id="powered"></i></div>
      <div class="qr" id="qrbox"><img id="qr" alt="QR" /><div><b id="follow"></b><span id="url"></span><span class="qr-langs" id="qr-langs"></span></div></div>
    </div>
  </main>
  <script type="module" src="/pages/screen.js"></script>
</body>
</html>
