# Weekly update pull requests: npm packages, and the GitHub Actions the workflows use (pinned to commit hashes,
# which Dependabot keeps current along with their "# vN" comments). Security alerts and fixes are turned on in the
# repository's Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # eslint and @eslint/js only work at the same major version: one pull request for both.
      eslint: { patterns: ['eslint', '@eslint/*'] }
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # Node's type definitions stay on an older Node.js line (22), so the type check flags APIs only newer ones have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
