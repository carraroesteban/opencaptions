# Every version tag becomes a GitHub release with the downloads organizers use:
#   git tag v0.2.0 && git push origin v0.2.0
# 1. release:  the release, with that version's section of CHANGELOG.md as the notes
# 2. launcher: "Start OpenCaptions.exe", compiled on Windows with the logo as its icon
# 3. desktop:  OpenCaptions-mac.zip and OpenCaptions-windows.zip (scripts/package-desktop.js), attached to it
# (The docker workflow publishes ghcr.io/…/opencaptions:<version> from the same tag.)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $v"; exit 1; fi
          cat >> notes.md <<EOF

          ---

          **Download:** [OpenCaptions for Mac](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/OpenCaptions-mac.zip) · [OpenCaptions for Windows](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/OpenCaptions-windows.zip). Open OpenCaptions; the first start downloads what it needs (Node.js too, if it isn't installed), and the "Read me" inside explains the first launch.

          **Docker:** \`docker run -d --pull always --name opencaptions -p 127.0.0.1:8080:8080 -v opencaptions-data:/app/data -v opencaptions-config:/app/config ghcr.io/$GITHUB_REPOSITORY:$v\`
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "OpenCaptions $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compile Start OpenCaptions.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ /win32icon:deploy\desktop\OpenCaptions.ico /out:"Start OpenCaptions.exe" /r:System.Windows.Forms.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll deploy\desktop\windows\Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launcher
          path: Start OpenCaptions.exe

  desktop:
    needs: [release, launcher]
    runs-on: macos-latest # compiles the Mac app's program (deploy/desktop/macos/OpenCaptions.swift)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: launcher
          path: launcher
      - run: node scripts/package-desktop.js --exe "launcher/Start OpenCaptions.exe"
      - name: Attach the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/OpenCaptions-mac.zip dist/OpenCaptions-windows.zip --clobber
