name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['^22.23.4', '^24.22.1'] # ranges, not 22/24: a runner's preinstalled Node may predate the October 2026 security fixes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in src/*.js src/engines/*.js src/local/*.js scripts/*.js; do node --check "$f"; done
      - run: npm test
        timeout-minutes: 15 # the suite takes about a minute: a hang fails fast instead of running for hours

  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '^22.23.4' # has the October 2026 security fixes
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  desktop:
    name: desktop downloads (launcher + packaging)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '^22.23.4' # has the October 2026 security fixes
      - name: Compile Start OpenCaptions.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ /win32icon:deploy\desktop\OpenCaptions.ico /out:"Start OpenCaptions.exe" /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll deploy\desktop\windows\Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # The packaging uses zip/ditto; on Windows it falls back to tar, which also writes .zip files.
      - run: node scripts/package-desktop.js --exe "Start OpenCaptions.exe"

  desktop-mac:
    name: desktop download (Mac app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '^22.23.4' # has the October 2026 security fixes
      - run: node scripts/package-desktop.js
      - name: The app's program runs on Apple and Intel chips
        run: lipo -archs dist/mac/OpenCaptions/OpenCaptions.app/Contents/MacOS/OpenCaptions | grep -q 'x86_64 arm64'

  a11y:
    name: accessibility (axe-core, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '^22.23.4' # has the October 2026 security fixes
          cache: npm
      - run: npm ci
      # Every page in light and dark, Spanish and English, in the runner's Google Chrome.
      - run: npm run a11y

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '^22.23.4' # has the October 2026 security fixes
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t opencaptions:ci .
      - name: Smoke test
        run: |
          docker run -d --name oc -p 8080:8080 -e ENGINE=mock opencaptions:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/event
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/status)" = "401"
          docker logs oc
