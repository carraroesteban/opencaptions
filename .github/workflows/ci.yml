name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in src/*.js src/engines/*.js src/local/*.js scripts/*.js; do node --check "$f"; done
      - run: npm test

  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  desktop:
    name: desktop downloads (launcher + packaging)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile Start OpenCaptions.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ /win32icon:deploy\desktop\OpenCaptions.ico /out:"Start OpenCaptions.exe" /r:System.Windows.Forms.dll deploy\desktop\windows\Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # The packaging uses zip/ditto; on Windows it falls back to tar, which also writes .zip files.
      - run: node scripts/package-desktop.js --exe "Start OpenCaptions.exe"

  a11y:
    name: accessibility (axe-core, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every page in light and dark, Spanish and English, in the runner's Google Chrome.
      - run: npm run a11y

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opencaptions:ci .
      - name: Smoke test
        run: |
          docker run -d --name oc -p 8080:8080 -e ENGINE=mock opencaptions:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/event
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/status)" = "401"
          docker logs oc
