name: Site

# Landing page at https://opencaptions.kvza.ar (site/ + shared tokens, brand assets and screenshots from the app).
# One-time setup: Settings → Pages → Source: "GitHub Actions"; DNS: CNAME opencaptions.kvza.ar → carraroesteban.github.io

on:
  push:
    branches: [main]
    paths: [site/**, public/tokens.css, public/style.css, public/brand/**, public/art/**, public/fonts/**, public/favicon.ico, public/apple-touch-icon.png, docs/images/**, scripts/site.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node scripts/site.js
        env:
          # Optional (Settings → Secrets and variables → Actions → Variables): search-engine verification codes and a
          # GoatCounter site code for visitor statistics. Unset, nothing is added to the pages.
          SITE_GOOGLE_VERIFICATION: ${{ vars.SITE_GOOGLE_VERIFICATION }}
          SITE_BING_VERIFICATION: ${{ vars.SITE_BING_VERIFICATION }}
          SITE_GOATCOUNTER: ${{ vars.SITE_GOATCOUNTER }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          include-hidden-files: true # .well-known/security.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Tell Bing (and through it DuckDuckGo, Yandex and others) that the pages changed, so they're re-read within hours.
  # IndexNow: the key is public by design; it proves the site is ours because site/0107667da613854eeb25e26816507eba.txt holds it.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify search engines
        env:
          KEY: 0107667da613854eeb25e26816507eba
          HOST: opencaptions.kvza.ar
        run: |
          urls=$(curl -fsS "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -sc .)
          echo "$urls"
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'content-type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$urls}"

