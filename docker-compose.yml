# OpenCaptions with Docker Compose.
#
#   cp .env.example .env            # optional settings: the API key can also be pasted in the dashboard
#   docker compose up -d --build    # server on http://localhost:8080
#   docker compose logs opencaptions | grep "Open the dashboard"   # a link that signs you in
#   docker compose --profile tunnel up -d   # + Cloudflare Tunnel (set TUNNEL_TOKEN in .env)
#
# See docs/deployment.md for the full guide.
services:
  opencaptions:
    build:
      context: .
      args:
        WITH_YTDLP: "${WITH_YTDLP:-0}"
    image: opencaptions:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Trust X-Forwarded-* from proxies on the private Docker network (the tunnel below).
      TRUST_PROXY: "${TRUST_PROXY:-uniquelocal}"
    ports:
      # Publish on localhost only by default. Set BIND_ADDR=0.0.0.0 in .env to reach it from the LAN (sign-in is required there).
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
      # SRT listener ports, if a stage uses `pull: "srt://0.0.0.0:900X?mode=listener"` (vMix / OBS push).
      # - "9001-9010:9001-9010/udp"
      # RTMP listener, if a room pulls `rtmp://0.0.0.0:1935/live/<key>` (OBS/vMix "Custom" stream target).
      # - "1935:1935"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Optional: publish over HTTPS without opening any inbound port (outbound-only connection to Cloudflare).
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Set TUNNEL_TOKEN in .env. (Not `${…:?}`: Compose checks that even when the tunnel profile is off.)
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    depends_on: [opencaptions]
